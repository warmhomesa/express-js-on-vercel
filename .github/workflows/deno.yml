        // --- Core Gemini Caller ---
        async function callGemini(prompt, systemInstruction = "") {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemInstruction }] } };

            for (let i = 0; i < 3; i++) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error(`API Error`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "عذراً، لم أتمكن من الاستجابة.";
                } catch (error) {
                    if (i === 2) return "حدث خطأ في الاتصال بالخادم. يرجى التأكد من توفر مفتاح API.";
                    await new Promise(res => setTimeout(res, 1500));
                }
            }
        }

