    <script>
        const apiKey = ""; 
        const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";

        // --- Data Persistence for Actual Numbers ---
        const defaultNums = { completed: 1500, experts: 45, satisfaction: 98, warranty: 10, active: 24, offers: 12, alerts: 3 };
        
        function loadActualNumbers() {
            const nums = JSON.parse(localStorage.getItem('shola_actual_numbers')) || defaultNums;
            
            if(document.getElementById('val-completed')) document.getElementById('val-completed').setAttribute('data-target', nums.completed);
            if(document.getElementById('val-satisfaction')) document.getElementById('val-satisfaction').setAttribute('data-target', nums.satisfaction);
            if(document.getElementById('val-experts')) document.getElementById('val-experts').setAttribute('data-target', nums.experts);
            if(document.getElementById('val-warranty')) document.getElementById('val-warranty').setAttribute('data-target', nums.warranty);
            if(document.getElementById('val-active')) document.getElementById('val-active').setAttribute('data-target', nums.active);
            
            if(document.getElementById('inp-completed')) document.getElementById('inp-completed').value = nums.completed;
            if(document.getElementById('inp-experts')) document.getElementById('inp-experts').value = nums.experts;
            if(document.getElementById('inp-active')) document.getElementById('inp-active').value = nums.active;
            if(document.getElementById('inp-satisfaction')) document.getElementById('inp-satisfaction').value = nums.satisfaction;
        }

        function saveActualNumbers() {
            const nums = JSON.parse(localStorage.getItem('shola_actual_numbers')) || defaultNums;
            nums.completed = document.getElementById('inp-completed').value || nums.completed;
            nums.experts = document.getElementById('inp-experts').value || nums.experts;
            nums.active = document.getElementById('inp-active').value || nums.active;
            nums.satisfaction = document.getElementById('inp-satisfaction').value || nums.satisfaction;
            
            localStorage.setItem('shola_actual_numbers', JSON.stringify(nums));
            document.getElementById('settings-modal').classList.add('hidden');
            loadActualNumbers();
            
            document.querySelectorAll('.pub-counter').forEach(el => el.innerText = '0');
            document.querySelectorAll('.dash-counter').forEach(el => el.innerText = '0');
