<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعلة التدفئة | المنظومة الشاملة والذكية</title>
    
    <!-- مكتبات التصميم والرسوم البيانية الأساسية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            height: 320px;
        }

        @media (min-width: 1024px) {
            .chart-container { height: 380px; max-height: 400px; }
        }

        /* رسومات الخلفية المتحركة */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: pulse 12s infinite alternate;
        }
        .shape-1 { top: -100px; right: -100px; width: 450px; height: 450px; background: #fde68a; } 
        .shape-2 { bottom: -100px; left: -100px; width: 550px; height: 550px; background: #e0f2fe; animation-delay: -6s; } 

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(20px, 20px); }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }

        /* Dashboard Styles */
        .nav-btn { transition: all 0.3s ease; }
        .nav-btn.active {
            background-color: #f59e0b; 
            color: white;
            box-shadow: 0 4px 14px 0 rgba(245, 158, 11, 0.4);
        }
        .tab-content { display: none; opacity: 0; transform: translateY(15px); transition: opacity 0.4s ease, transform 0.4s ease; }
        .tab-content.active { display: block; opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="relative min-h-screen">

    <!-- أشكال الخلفية المشتركة -->
    <div class="bg-shape shape-1 fixed pointer-events-none"></div>
    <div class="bg-shape shape-2 fixed pointer-events-none"></div>

    <!-- ========================================================================= -->
    <!-- 1. واجهة العملاء العامة (Public View) -->
    <!-- ========================================================================= -->
    <div id="public-view" class="transition-all duration-500 block">
        <!-- الشريط العلوي -->
        <header class="glass-panel sticky top-0 z-50 border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-br from-amber-400 to-orange-500 text-white w-12 h-12 rounded-xl flex items-center justify-center text-2xl shadow-lg">🔥</div>
                    <div>
                        <h1 class="text-xl font-black text-slate-800 tracking-tight">شعلة التدفئة</h1>
                        <p class="text-[10px] text-amber-600 font-bold uppercase tracking-widest">للرفاهية الهندسية</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="bg-slate-100 text-slate-600 px-4 py-2.5 rounded-full text-xs font-bold hover:bg-slate-200 transition-all shadow-sm flex items-center gap-2 border border-slate-200">
                        🔒 الإدارة
                    </button>
                    <a href="https://wa.me/" target="_blank" class="hidden md:flex bg-slate-900 text-white px-6 py-2.5 rounded-full text-sm font-bold hover:bg-amber-500 hover:text-slate-900 transition-all shadow-md items-center gap-2">
                        💬 تواصل معنا
                    </a>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-12">
            <!-- قسم الترحيب -->
            <section class="text-center mb-16">
                <span class="bg-amber-100 text-amber-800 px-4 py-1.5 rounded-full text-xs font-bold mb-4 inline-block border border-amber-200">خبرة هندسية منذ عام 2009</span>
                <h2 class="text-4xl md:text-6xl font-black text-slate-900 mb-6 leading-tight">هندسة تفوق <span class="text-amber-500">التوقعات</span></h2>
                <p class="text-slate-600 max-w-2xl mx-auto text-lg leading-relaxed mb-10">نؤسس بيئات أكثر دفئاً لعائلتك بأرقى المعايير المائية والحرارية المعتمدة للمسابح والتدفئة المركزية.</p>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8 max-w-4xl mx-auto">
                    <div class="glass-panel p-6 rounded-3xl text-center"><div class="text-3xl mb-2">🏗️</div><div class="text-3xl font-black text-slate-800 mb-1">+<span class="pub-counter" id="val-completed" data-target="1500">0</span></div><div class="text-xs font-bold text-slate-500">مشروع منجز</div></div>
                    <div class="glass-panel p-6 rounded-3xl text-center"><div class="text-3xl mb-2">⭐</div><div class="text-3xl font-black text-slate-800 mb-1"><span class="pub-counter" id="val-satisfaction" data-target="98">0</span>%</div><div class="text-xs font-bold text-slate-500">رضا العملاء</div></div>
                    <div class="glass-panel p-6 rounded-3xl text-center"><div class="text-3xl mb-2">👨‍🔧</div><div class="text-3xl font-black text-slate-800 mb-1">+<span class="pub-counter" id="val-experts" data-target="45">0</span></div><div class="text-xs font-bold text-slate-500">خبير وفني</div></div>
                    <div class="glass-panel p-6 rounded-3xl text-center"><div class="text-3xl mb-2">🛡️</div><div class="text-3xl font-black text-slate-800 mb-1"><span class="pub-counter" id="val-warranty" data-target="10">0</span></div><div class="text-xs font-bold text-slate-500">سنوات ضمان</div></div>
                </div>
            </section>

            <!-- الخدمات والشارت -->
            <section class="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-16">
                <div class="glass-panel p-8 rounded-[40px]">
                    <h3 class="text-2xl font-bold text-slate-800 mb-2">توزيع مشاريعنا</h3>
                    <p class="text-sm text-slate-500 mb-8">نسبة تنفيذ الخدمات في الفلل والقصور بالمنطقة الجنوبية</p>
                    <div class="chart-container"><canvas id="publicServicesChart"></canvas></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="glass-panel p-6 rounded-3xl border-t-4 border-amber-500"><div class="text-4xl mb-4">🔥</div><h4 class="font-bold text-lg text-slate-800 mb-2">التدفئة المركزية</h4><p class="text-sm text-slate-600 leading-relaxed">أنظمة ديزل آمنة واقتصادية لتدفئة متكاملة تحت البلاط.</p></div>
                    <div class="glass-panel p-6 rounded-3xl border-t-4 border-sky-500"><div class="text-4xl mb-4">🏊‍♂️</div><h4 class="font-bold text-lg text-slate-800 mb-2">المسابح الخرسانية</h4><p class="text-sm text-slate-600 leading-relaxed">تنفيذ خرساني مسلح قوي (لا نستخدم الفايبرجلاس).</p></div>
                    <div class="glass-panel p-6 rounded-3xl border-t-4 border-emerald-500"><div class="text-4xl mb-4">⛲</div><h4 class="font-bold text-lg text-slate-800 mb-2">الشلالات والنوافير</h4><p class="text-sm text-slate-600 leading-relaxed">تصاميم جدارية ومائية فريدة وعزل أمريكي معتمد.</p></div>
                    <div class="glass-panel p-6 rounded-3xl border-t-4 border-purple-500"><div class="text-4xl mb-4">🧖‍♂️</div><h4 class="font-bold text-lg text-slate-800 mb-2">الساونا والبخار</h4><p class="text-sm text-slate-600 leading-relaxed">تجهيز غرف استشفاء منزلية بأرقى أنواع الأخشاب.</p></div>
                </div>
            </section>
        </main>

        <footer class="bg-slate-900 text-slate-400 py-10 text-center border-t border-slate-800">
            <div class="text-2xl mb-4">🔥</div><p class="font-bold text-white mb-2">مؤسسة شعلة التدفئة للمقاولات</p>
            <p class="text-sm mb-4">أبها وخميس مشيط - المملكة العربية السعودية</p>
        </footer>

        <!-- Public AI Chat -->
        <div class="fixed bottom-6 left-6 z-40 flex flex-col items-start">
            <div id="pub-chat-window" class="hidden glass-panel shadow-2xl rounded-[30px] w-[320px] md:w-[380px] h-[450px] mb-4 flex flex-col overflow-hidden transition-all duration-300">
                <div class="bg-gradient-to-r from-amber-500 to-amber-600 p-4 text-slate-900 flex justify-between items-center">
                    <span class="font-bold text-sm">🤖 مستشار العملاء الذكي</span>
                    <button onclick="document.getElementById('pub-chat-window').classList.add('hidden')" class="hover:text-white font-bold">✕</button>
                </div>
                <div id="pub-chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-4 bg-slate-50/50 custom-scrollbar">
                    <div class="bg-white border border-slate-200 text-slate-800 p-4 rounded-2xl rounded-tr-none text-sm w-[90%] self-start shadow-sm leading-relaxed">أهلاً بك في "شعلة التدفئة" 🔥.<br>أنا المساعد الآلي، تفضل بسؤالي عن خدماتنا، أسعارنا التقديرية، أو تفاصيل تنفيذ المسابح والتدفئة!</div>
                </div>
                <div class="p-3 bg-white border-t border-slate-100 flex gap-2">
                    <input type="text" id="pub-chat-input" placeholder="اكتب سؤالك هنا..." class="flex-1 bg-slate-100 px-3 py-2 rounded-lg text-sm outline-none" onkeypress="if(event.key === 'Enter') sendPubMsg()">
                    <button onclick="sendPubMsg()" id="btn-pub-send" class="bg-slate-900 text-white px-4 py-2 rounded-lg font-bold text-xs">إرسال</button>
                </div>
            </div>
            <button onclick="document.getElementById('pub-chat-window').classList.toggle('hidden')" class="bg-slate-900 text-white w-14 h-14 rounded-full shadow-2xl hover:bg-amber-500 hover:text-slate-900 transition-all border-2 border-white/50 text-2xl flex justify-center items-center">💬</button>
        </div>
    </div>


    <!-- ========================================================================= -->
    <!-- 2. نافذة تسجيل الدخول ونافذة إعدادات الأرقام الفعلية -->
    <!-- ========================================================================= -->
    <div id="login-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-[999]">
        <div class="bg-white p-8 md:p-10 rounded-3xl w-full max-w-sm text-center relative shadow-2xl border border-slate-200">
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="absolute top-4 left-4 text-slate-400 hover:text-slate-800 text-xl font-bold">✕</button>
            <div class="bg-slate-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-600 text-2xl">🔒</div>
            <h3 class="text-xl font-bold mb-6 text-slate-800">بوابة الإدارة</h3>
            <input type="text" id="login-id" placeholder="الرقم الوظيفي (HT-1001)" class="w-full border border-slate-200 p-3 rounded-xl mb-3 text-sm outline-none focus:border-amber-400 bg-slate-50 text-left" dir="ltr">
            <input type="password" id="login-pass" placeholder="كلمة المرور (Admin99)" class="w-full border border-slate-200 p-3 rounded-xl mb-6 text-sm outline-none focus:border-amber-400 bg-slate-50 text-left" dir="ltr">
            <button onclick="attemptLogin()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-amber-500 hover:text-slate-900 transition-colors">تسجيل الدخول</button>
            <p id="login-error" class="text-red-500 text-xs font-bold mt-3 hidden">بيانات الدخول غير صحيحة!</p>
        </div>
    </div>

    <!-- نافذة إعدادات الأرقام الفعلية -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-[999]">
        <div class="bg-white p-8 md:p-10 rounded-3xl w-full max-w-sm text-right relative shadow-2xl border border-slate-200">
            <button onclick="document.getElementById('settings-modal').classList.add('hidden')" class="absolute top-4 left-4 text-slate-400 hover:text-slate-800 text-xl font-bold">✕</button>
            <h3 class="text-xl font-bold mb-6 text-slate-800 flex items-center gap-2">⚙️ الأرقام الفعلية للمؤسسة</h3>
            <p class="text-xs text-slate-500 mb-6 font-bold">أدخل الأرقام الحقيقية هنا وسيقوم النظام بتحديث واجهة العملاء ولوحة القيادة فوراً.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-500">إجمالي المشاريع المنجزة</label>
                    <input type="number" id="inp-completed" class="w-full border border-slate-200 p-3 rounded-xl mt-1 text-sm bg-slate-50 outline-none focus:border-amber-500" />
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">عدد الفنيين والخبراء</label>
                    <input type="number" id="inp-experts" class="w-full border border-slate-200 p-3 rounded-xl mt-1 text-sm bg-slate-50 outline-none focus:border-amber-500" />
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">المشاريع النشطة حالياً (في الميدان)</label>
                    <input type="number" id="inp-active" class="w-full border border-slate-200 p-3 rounded-xl mt-1 text-sm bg-slate-50 outline-none focus:border-amber-500" />
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">نسبة رضا العملاء (%)</label>
                    <input type="number" id="inp-satisfaction" class="w-full border border-slate-200 p-3 rounded-xl mt-1 text-sm bg-slate-50 outline-none focus:border-amber-500" />
                </div>
            </div>
            
            <button onclick="saveActualNumbers()" class="w-full bg-amber-500 text-slate-900 py-3 rounded-xl font-bold hover:bg-amber-600 transition-colors mt-8 shadow-md">حفظ وتحديث الواجهة</button>
        </div>
    </div>


    <!-- ========================================================================= -->
    <!-- 3. لوحة القيادة الإدارية (Dashboard View) -->
    <!-- ========================================================================= -->
    <div id="dashboard-view" class="hidden transition-all duration-500 pb-20">
        <nav class="glass-panel sticky top-0 z-50 px-6 py-4 mb-8 border-b border-slate-200">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="text-3xl bg-amber-100 p-2 rounded-xl">🔥</div>
                    <div>
                        <h1 class="text-2xl font-black text-slate-800 tracking-tight">شعلة التدفئة</h1>
                        <p class="text-xs text-amber-600 font-bold tracking-widest uppercase">المركز القيادي - سير العمل</p>
                    </div>
                </div>
                <div class="flex items-center gap-4 overflow-x-auto custom-scrollbar pb-2 md:pb-0 w-full md:w-auto">
                    <div class="flex gap-2 bg-slate-100 p-1.5 rounded-full whitespace-nowrap">
                        <button onclick="switchDashTab('overview')" id="btn-overview" class="nav-btn active px-5 py-2 rounded-full text-sm font-bold text-slate-600">📊 الأداء</button>
                        <button onclick="switchDashTab('services')" id="btn-services" class="nav-btn px-5 py-2 rounded-full text-sm font-bold text-slate-600">🎯 الخدمات</button>
                        <button onclick="switchDashTab('ai-tools')" id="btn-ai-tools" class="nav-btn px-5 py-2 rounded-full text-sm font-bold text-slate-600">✨ المساعد الذكي</button>
                    </div>
                    <!-- زر إعدادات الأرقام الفعلية -->
                    <button onclick="document.getElementById('settings-modal').classList.remove('hidden')" class="bg-white text-slate-600 px-4 py-2 rounded-full text-xs font-bold hover:bg-slate-200 transition-all border border-slate-200 shadow-sm whitespace-nowrap">⚙️ الأرقام الفعلية</button>
                    <button onclick="logout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-full text-xs font-bold hover:bg-red-600 hover:text-white transition-all border border-red-200 whitespace-nowrap">خروج</button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6">
            <section id="overview" class="tab-content active">
                <div class="bg-slate-900 text-white p-6 rounded-3xl mb-8 flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl">
                    <div><h2 class="text-xl font-bold mb-1">👋 أهلاً بك أستاذ أحمد</h2><p class="text-slate-400 text-sm">إليك ملخص الإنجاز الميداني لمشاريع أبها وخميس مشيط.</p></div>
                    <div class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2">
                        <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span></span>
                        النظام الميداني متصل
                    </div>
                </div>

                <!-- Team Tasks Widget -->
                <div class="glass-panel p-8 rounded-3xl mb-8 border-t-4 border-indigo-500 shadow-lg">
                    <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">👥 فريق العمل المباشر ومهام اليوم</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl flex items-center gap-4 hover:shadow-md transition-shadow">
                            <div class="bg-amber-100 text-amber-600 w-12 h-12 flex justify-center items-center rounded-xl font-black text-lg">م.م</div>
                            <div>
                                <h4 class="font-bold text-sm text-slate-800">م. محمد</h4>
                                <p class="text-xs text-slate-500 font-bold mb-1">إشراف التنفيذ</p>
                                <p class="text-[10px] text-amber-600 bg-amber-50 px-2 py-1 rounded-md">إشراف صب خرسانة المسبح</p>
                            </div>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl flex items-center gap-4 hover:shadow-md transition-shadow">
                            <div class="bg-sky-100 text-sky-600 w-12 h-12 flex justify-center items-center rounded-xl font-black text-lg">م.ح</div>
                            <div>
                                <h4 class="font-bold text-sm text-slate-800">م. محسن</h4>
                                <p class="text-xs text-slate-500 font-bold mb-1">تخطيط هندسي</p>
                                <p class="text-[10px] text-sky-600 bg-sky-50 px-2 py-1 rounded-md">مراجعة مخططات تدفئة الديزل</p>
                            </div>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl flex items-center gap-4 hover:shadow-md transition-shadow">
                            <div class="bg-purple-100 text-purple-600 w-12 h-12 flex justify-center items-center rounded-xl font-black text-lg">ج</div>
                            <div>
                                <h4 class="font-bold text-sm text-slate-800">جواهر</h4>
                                <p class="text-xs text-slate-500 font-bold mb-1">سكرتارية ومتابعة</p>
                                <p class="text-[10px] text-purple-600 bg-purple-50 px-2 py-1 rounded-md">جدولة المعاينات وتنسيق التقارير</p>
                            </div>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl flex items-center gap-4 hover:shadow-md transition-shadow">
                            <div class="bg-emerald-100 text-emerald-600 w-12 h-12 flex justify-center items-center rounded-xl font-black text-lg">ف</div>
                            <div>
                                <h4 class="font-bold text-sm text-slate-800">فيصل</h4>
                                <p class="text-xs text-slate-500 font-bold mb-1">مبيعات وتسعير</p>
                                <p class="text-[10px] text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">إغلاق عقود الصيانة الشتوية</p>
                            </div>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl flex items-center gap-4 hover:shadow-md transition-shadow">
                            <div class="bg-indigo-100 text-indigo-600 w-12 h-12 flex justify-center items-center rounded-xl font-black text-lg">أ.ب</div>
                            <div>
                                <h4 class="font-bold text-sm text-slate-800">أبو بكر</h4>
                                <p class="text-xs text-slate-500 font-bold mb-1">تنسيق ميداني</p>
                                <p class="text-[10px] text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md">توزيع فنيي العزل للمواقع</p>
                            </div>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl flex items-center gap-4 hover:shadow-md transition-shadow">
                            <div class="bg-rose-100 text-rose-600 w-12 h-12 flex justify-center items-center rounded-xl font-black text-lg">أ.س</div>
                            <div>
                                <h4 class="font-bold text-sm text-slate-800">أ. أسعد</h4>
                                <p class="text-xs text-slate-500 font-bold mb-1">شؤون قانونية</p>
                                <p class="text-[10px] text-rose-600 bg-rose-50 px-2 py-1 rounded-md">تدقيق ملاحق عقود الضمان</p>
                            </div>
                        </div>
                    </div>
